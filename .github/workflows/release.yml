name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tag and title
        id: tag
        run: |
          ymd="$(date -u +%Y%m%d)"
          base="v${ymd:0:4}.${ymd:4:2}.${ymd:6:2}"
          tag="$base"
          n=1
          while git ls-remote --tags origin "refs/tags/$tag" | grep -q .; do
            n=$((n+1)); tag="${base}-${n}"
          done
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "title=${ymd}.${n}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(git tag --sort=-version:refname | head -1)
          args="--field tag_name=${{ steps.tag.outputs.tag }}"
          [ -n "$prev" ] && args="$args --field previous_tag_name=$prev"
          body=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            $args --jq '.body')
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$body"     >> $GITHUB_OUTPUT
          echo "EOF"       >> $GITHUB_OUTPUT

      - name: Detect addons
        id: addons
        run: |
          addons=$(for d in */; do d="${d%/}"; [ -f "$d/$d.lua" ] && echo "$d"; done | tr '\n' ' ')
          echo "list=$addons" >> $GITHUB_OUTPUT

      - name: Package addons
        run: |
          mkdir -p staging
          for addon in ${{ steps.addons.outputs.list }}; do
            cp -r $addon/. staging/$addon/
            rm -rf staging/$addon/data
            libs=$(awk '/^## Libraries/{f=1;next} /^#/{f=0} f && /^- /{ if (match($0, /`[^`]+`/)) print substr($0, RSTART+1, RLENGTH-2) }' "$addon/README.md")
            for lib in $libs; do
              [ -d "$lib" ] || continue
              mkdir -p "staging/$addon/$lib"
              cp -r "$lib/." "staging/$addon/$lib/"
            done
            find "staging/$addon" -name CLAUDE.md -delete
            version=$(grep -m1 "_addon\.version" $addon/$addon.lua | grep -oE "'[0-9.]+'" | tr -d "'")
            (cd staging && zip -r ../$addon-v${version}.zip $addon/)
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          body: ${{ steps.notes.outputs.body }}
          files: "*.zip"
